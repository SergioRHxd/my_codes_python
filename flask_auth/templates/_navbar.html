<nav class="nav">
  <a class="brand" href="{{ url_for('users.index') }}">Flask Auth</a>
  <div class="nav-links">
    <a href="{{ url_for('users.index') }}">Inicio</a>
    {% if current_user.is_authenticated %}
      <a href="{{ url_for('users.profile') }}">Perfil ({{ current_user.username|capitalize }})</a>
      <a href="{{ url_for('users.logout') }}">Cerrar sesión</a>
    {% else %}
      <a href="{{ url_for('users.register') }}">Registro</a>
      <a href="{{ url_for('users.login') }}">Iniciar sesión</a>
    {% endif %}
  </div>
</nav>
