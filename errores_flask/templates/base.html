<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Videojuegos{% endblock %} | Microapp de videojuegos</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
    header { background: #23272f; color: #fff; padding: 14px 24px; }
    header a { color: #fff; text-decoration: none; margin-right: 18px; }
    main { max-width: 760px; margin: 32px auto; background: #fff; padding: 28px 32px; border-radius: 8px; }
    .error-code { font-size: 72px; font-weight: 700; margin: 0; color: #c0392b; }
    .btn { display: inline-block; padding: 8px 16px; background: #2d6cdf; color: #fff; border-radius: 6px; text-decoration: none; border: 0; cursor: pointer; font-size: 15px; }
    ul.games li { margin: 8px 0; }
    footer { text-align: center; color: #777; font-size: 13px; padding: 16px; }
  </style>
</head>
<body>
  <header>
    <a href="/"><strong>🎮 Videojuegos</strong></a>
    <a href="/pruebas">Pruebas de errores</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>A5 · Manejo de errores y seguridad básica en Flask</footer>
</body>
</html>
