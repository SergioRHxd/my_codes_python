{% extends "base.html" %}
{% block title %}Inicio{% endblock %}
{% block content %}
<h1>Catálogo de videojuegos</h1>
<ul class="games">
  {% for g in games %}
  <li>
    <a href="{{ url_for('videogame', id=g.id, plataforma='PC') }}">{{ g.title }}</a>
    — {{ g.genre }} ({{ g.year }})
  </li>
  {% endfor %}
</ul>
{% endblock %}
